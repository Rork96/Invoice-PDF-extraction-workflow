# Local n8n to import app/workflow/*.json. Credentials are created in the n8n UI, never stored in this repo.
services:
  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me}
      - GENERIC_TIMEZONE=UTC
    volumes: ["n8n_data:/home/node/.n8n"]
volumes:
  n8n_data:
